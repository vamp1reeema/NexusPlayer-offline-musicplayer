name: nexus_player
description: A phone-first offline Nexus Player music player.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  on_audio_query: ^2.9.0
  audio_session: ^0.1.25
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
